<article class="blog-post">
  <p class="post-meta">{{ include.post.date | date: '%Y-%m-%d' }}{% if include.post.categories.size > 0 %} · {{ include.post.categories | join: '、' }}{% endif %}</p>
  <h2><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 150 }}</p>
  <a class="read-more" href="{{ include.post.url | relative_url }}">閱讀全文 →</a>
</article>
